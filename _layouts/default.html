<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1b1b1f;
      --muted: #5c5c66;
      --rule: #e3e3e8;
      --link: #1a5fb4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16161a;
        --fg: #e6e6ea;
        --muted: #a0a0ac;
        --rule: #2e2e36;
        --link: #7ab3ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.65;
      -webkit-text-size-adjust: 100%;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
    header.site {
      border-bottom: 1px solid var(--rule);
      padding: 18px 0;
      margin-bottom: 40px;
    }
    header.site a {
      font-weight: 600;
      text-decoration: none;
      color: var(--fg);
    }
    main { padding-bottom: 64px; }
    h1 {
      font-size: 1.9rem;
      line-height: 1.25;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
    }
    h2 {
      font-size: 1.15rem;
      line-height: 1.35;
      margin: 40px 0 10px;
      padding-top: 20px;
      border-top: 1px solid var(--rule);
      letter-spacing: -0.005em;
    }
    h2:first-of-type { border-top: none; padding-top: 0; }
    p { margin: 0 0 16px; }
    a { color: var(--link); }
    ul { padding-left: 22px; }
    li { margin-bottom: 8px; }
    .updated {
      color: var(--muted);
      font-size: 0.92rem;
      margin: 0 0 36px;
    }
    footer.site {
      border-top: 1px solid var(--rule);
      padding: 22px 0 44px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    footer.site a { color: var(--muted); }
    @media (max-width: 480px) {
      body { font-size: 16px; }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <header class="site">
    <div class="wrap"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></div>
  </header>

  <main class="wrap">
    {% if page.title %}<h1>{{ page.title }}</h1>{% endif %}
    {% if page.updated %}<p class="updated">Last updated: {{ page.updated }}</p>{% endif %}
    {{ content }}
  </main>

  <footer class="site">
    <div class="wrap">© {{ site.time | date: '%Y' }} Tanoru · <a href="{{ '/' | relative_url }}">Home</a></div>
  </footer>
</body>
</html>
